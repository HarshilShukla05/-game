<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake Smash Karts</title>
<style>html, body { margin: 0; background: #003f8a; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<script>
// Mirrors the parts of smashkarts.io the bot depends on (scripts/main.js):
// global function declarations Unity calls, and window.copyText(link).
// ?load=ms simulates a slow load; like the real game, the menu-ready callback
// fires early (at half the load time) while an in-canvas "Loading…" screen
// is still up. ?room=ms is how long the "server" takes to create the room.
var loadingState = 'None';
function updateLoadingState(n) { loadingState = n; }
function onLoadingToMainMenuComplete(n) {}
function copyTextToClipboard(n) {
  var t = document.createElement('textarea');
  t.value = n; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(t);
}
window.copyText = function (n) {
  var t = function () { copyTextToClipboard(n); document.removeEventListener('mouseup', t); };
  document.addEventListener('mouseup', t);
};

var params = new URLSearchParams(location.search);
var LOAD_MS = Number(params.get('load') || 1000);
var ROOM_MS = Number(params.get('room') || 1500);
var LINK = 'https://smashkarts.io/?room=TEST123';

var c = document.getElementById('gameCanvas');
var g = c.getContext('2d');
window.__fake = { screen: 'loading', mode: null, map: null, wastedClicks: 0 };

var BUTTONS = {
  menu: [{ id: 'create', x: 540, y: 360, w: 200, h: 80, color: '#ff7a00', label: 'CREATE' }],
  settings: [
    { id: 'nukes', x: 300, y: 250, w: 200, h: 80, color: '#aa2222', label: 'NUKES' },
    { id: 'smash', x: 780, y: 250, w: 200, h: 80, color: '#2222aa', label: 'SMASH ISLAND' },
    { id: 'start', x: 540, y: 500, w: 200, h: 80, color: '#22aa22', label: 'CREATE ROOM' },
  ],
  lobby: [{ id: 'copy', x: 540, y: 560, w: 200, h: 80, color: '#ffcc00', label: 'COPY LINK' }],
};

function draw() {
  var s = window.__fake.screen;
  g.fillStyle = s === 'loading' || s === 'creating' ? '#003f8a' : '#1b1b3a';
  g.fillRect(0, 0, 1280, 720);
  g.fillStyle = '#fff'; g.font = '32px sans-serif';
  if (s === 'loading') g.fillText('Loading…', 40, 680);
  if (s === 'creating') g.fillText('Creating room…', 40, 680);
  (BUTTONS[s] || []).forEach(function (b) {
    var selected = (b.id === 'nukes' && window.__fake.mode === 'nukes') || (b.id === 'smash' && window.__fake.map === 'smash');
    g.fillStyle = selected ? '#ffffff' : b.color;
    g.fillRect(b.x, b.y, b.w, b.h);
    g.fillStyle = selected ? '#000' : '#fff'; g.font = '20px sans-serif';
    g.fillText(b.label, b.x + 16, b.y + 48);
  });
}

function hit(x, y) {
  return (BUTTONS[window.__fake.screen] || []).find(function (b) {
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  });
}

// Like Unity: a press on the copy button copies right away (pointerdown);
// other buttons act on release.
c.addEventListener('pointerdown', function (e) {
  var b = hit(e.offsetX, e.offsetY);
  if (b && b.id === 'copy') window.copyText(LINK);
});
c.addEventListener('pointerup', function (e) {
  var b = hit(e.offsetX, e.offsetY);
  var f = window.__fake;
  if (!b) { f.wastedClicks++; return; }
  if (b.id === 'create') f.screen = 'settings';
  else if (b.id === 'nukes') f.mode = 'nukes';
  else if (b.id === 'smash') f.map = 'smash';
  else if (b.id === 'start') {
    if (f.mode !== 'nukes' || f.map !== 'smash') { f.wastedClicks++; return; }
    f.screen = 'creating';
    setTimeout(function () { f.screen = 'lobby'; draw(); }, ROOM_MS);
  }
  draw();
});

draw();
updateLoadingState('Closed');
setTimeout(function () { onLoadingToMainMenuComplete(true); }, LOAD_MS / 2);
setTimeout(function () { window.__fake.screen = 'menu'; draw(); }, LOAD_MS);
</script>
</body>
</html>
