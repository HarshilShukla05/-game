# Inframan deployment: one always-on bot, never two (two bots on one WhatsApp
# number would both answer @game), so a fixed single replica and a recreate
# rollout instead of blue-green.
version: v1
application: smashbot
services:
  bot:
    type: worker
    scaling:
      type: "off"
      min_replicas: 1
    rollout:
      strategy: recreate
    termination_grace_seconds: 30
    node_pool: application-pool
    # Only what the image copies (see Dockerfile; it is always watched).
    # A push touching only docs, tests or tools does not restart the bot,
    # which would end a live room.
    build:
      method: docker
      dockerfile: ./Dockerfile
      watch_paths:
        - src
        - recordings
        - config.json
        - package.json
        - package-lock.json
    # Chromium renders the game's WebGL in software (no GPU). The pool's
    # e2-medium nodes have about 0.94 allocatable vCPU and 2.8 GiB; the bot
    # bursts to both cores while it builds a room.
    # Memory: the browser measured 1.3 GiB at peak (1.1 GiB in a round), so the
    # limit sits just above that. The request is kept small on the shared
    # nodes (owner's choice): under memory pressure this pod is evicted first,
    # which spares the other services and only restarts the bot.
    resources:
      cpu_request: 700m
      memory_request: 100Mi
      cpu_limit: "2"
      memory_limit: 1536Mi
    env:
      # The bot phone's number: links WhatsApp by a code in the logs.
      WA_PAIRING_NUMBER: "917905878588"
    connections:
      # The WhatsApp login, under keys prefixed smashbot:wa:. This Redis has
      # no persistence: if it restarts, the bot logs a new pairing code.
      REDIS_URL: redis/inframan-hosting-central-1
