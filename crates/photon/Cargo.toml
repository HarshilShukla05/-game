[package]
name = "photon"
version = "0.1.0"
description = "Photon (Exit Games) binary protocol 1.8 codec and WebSocket client, game-agnostic"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Async WebSocket client. The codec alone needs no dependencies.
client = ["dep:tokio", "dep:futures-util", "dep:log", "dep:net"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
log = { version = "0.4", optional = true }
net = { path = "../net", optional = true }
