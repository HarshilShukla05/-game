[package]
name = "net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Outbound connections: TCP through an HTTP proxy when one is set, TLS, WebSocket"

[lints]
workspace = true

[dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "rustls-bring-your-own-connector", "rand", "ring"] }
http = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
